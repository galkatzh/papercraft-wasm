<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Papercraft Unfolder</title>
<!-- Vanilla JS, no build step. Three.js is vendored locally and resolved via this import map. -->
<script type="importmap">
{
  "imports": {
    "three": "./vendor/three/three.module.js"
  }
}
</script>
<style>
  :root { --bg:#1e1f24; --panel:#2a2c33; --ink:#e8e8ea; --muted:#9aa0aa; --accent:#5b8cff; }
  * { box-sizing: border-box; }
  html, body { margin:0; height:100%; background:var(--bg); color:var(--ink);
    font:14px/1.4 system-ui, sans-serif; }
  #app { display:flex; flex-direction:column; height:100%; }
  header { display:flex; gap:8px; align-items:center; padding:8px 12px;
    background:var(--panel); border-bottom:1px solid #000; flex-wrap:wrap; }
  header h1 { font-size:15px; margin:0 12px 0 0; font-weight:600; }
  button, label.file { background:#3a3d47; color:var(--ink); border:1px solid #4a4e5a;
    border-radius:6px; padding:6px 12px; cursor:pointer; font-size:13px; }
  button:hover, label.file:hover { background:#464a56; }
  button:disabled { opacity:.45; cursor:default; }
  button.active { background:var(--accent); border-color:var(--accent); color:#fff; }
  label.file input { display:none; }
  .sep { width:1px; height:24px; background:#4a4e5a; margin:0 4px; }
  .spacer { flex:1; }
  #status { color:var(--muted); font-size:12px; }
  main { display:flex; flex:1; min-height:0; }
  .view { flex:1; position:relative; min-width:0; }
  .view + .view { border-left:2px solid #000; }
  .view h2 { position:absolute; top:8px; left:10px; margin:0; font-size:11px;
    text-transform:uppercase; letter-spacing:.08em; color:var(--muted); z-index:2;
    pointer-events:none; }
  #c3d { display:block; width:100%; height:100%; }
  #c2d { display:block; width:100%; height:100%; background:#15161a; }
  .hint { position:absolute; bottom:8px; left:10px; font-size:11px; color:var(--muted);
    z-index:2; pointer-events:none; }
</style>
</head>
<body>
<div id="app">
  <header>
    <h1>Papercraft Unfolder</h1>
    <label class="file">Open model
      <input id="file" type="file" accept=".stl,.obj,.pdo,.glb,.gltf,.craft" />
    </label>
    <button id="unwrap" disabled>Unwrap</button>
    <button id="repack" disabled>Repack</button>
    <div class="sep"></div>
    <button id="mode-split" class="mode active" disabled>Split edge</button>
    <button id="mode-join" class="mode" disabled>Join edge</button>
    <div class="sep"></div>
    <button id="pdf" disabled>Export PDF</button>
    <button id="svg" disabled>Export SVG</button>
    <button id="craft" disabled>Save .craft</button>
    <div class="spacer"></div>
    <span id="status">Loading engine…</span>
  </header>
  <main>
    <section class="view">
      <h2>3D model</h2>
      <canvas id="c3d"></canvas>
      <div class="hint">drag to orbit · scroll to zoom · click an edge to split/join</div>
    </section>
    <section class="view">
      <h2>2D net</h2>
      <canvas id="c2d"></canvas>
      <div class="hint">scroll to zoom · drag to pan · click a fold/cut to split/join</div>
    </section>
  </main>
</div>
<script type="module" src="./app.js"></script>
</body>
</html>
